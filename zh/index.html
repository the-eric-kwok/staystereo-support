<h1>好音质，留给你的耳机。</h1>
<p>StayStereo 是一款 macOS 菜单栏应用，用于阻止系统默认输入被切换到 AirPods 或其他蓝牙耳机麦克风，从而避免蓝牙输出降入低音质的 HFP/HSP 通话模式。它始终保留你选择的系统默认输出。</p>
